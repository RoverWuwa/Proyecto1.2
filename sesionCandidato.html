<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <link rel="stylesheet" href="css/styles3.css">
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <img src="imagenes/logo2.webp" alt="Logo" class="logo">
            <h1>Iniciar sesión</h1>
        </div>

        <form class="login-form">
            <label for="username">Usuario o correo electrónico</label>
            <input type="text" id="username" required>

            <div class="password-row">
                <label for="password">Contraseña</label>
                <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
            </div>
            <input type="password" id="password" required>

            <button type="submit" class="signin-btn">Iniciar sesión</button>
        </form>

        <div class="divider">
            <span>o</span>
        </div>

        <p class="signup-text">¿Nuevo aquí? <a href="#">Crea una cuenta</a></p>

        <div class="footer-links">
            <a href="#">Términos</a>
            <a href="#">Privacidad</a>
            <a href="#">Soporte</a>
            <a href="#">Administrar cookies</a>
            <a href="#">No compartir mi información</a>
        </div>
    </div>

    <script src="js/scripts3.js"></script>
</body>
</html>
